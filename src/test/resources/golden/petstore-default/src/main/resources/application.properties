# Generated by SpecForge from "Pet Store" (1.0.0). Safe to edit.
spring.application.name=pet-store
# the spec's base path (/v1) is applied by the controllers' @RequestMapping

spring.datasource.url=jdbc:h2:mem:pet_store;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
# keeps the Hibernate session open while entities are serialised, so lazy collections can be written as JSON
spring.jpa.open-in-view=true
# quote every identifier so spec names such as "order" or "user" never collide with SQL keywords
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ---- security ----
# TODO: point this at your authorization server's JWK set
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
# scheme oauth: token URL https://auth.example.com/token
# comma-separated list of accepted API keys - CHANGE THESE
app.security.api-keys=dev-key-change-me
