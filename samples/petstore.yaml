openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
tags:
  - name: pet
paths:
  /pets:
    get:
      tags: [pet]
      operationId: listPets
      responses:
        '200':
          description: All pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
    post:
      tags: [pet]
      operationId: addPet
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
  /pets/{petId}:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [pet]
      operationId: getPet
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
    delete:
      tags: [pet]
      operationId: deletePet
      security:
        - oauth: [write:pets]
      responses:
        '204': { description: Deleted }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-KEY }
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes: { 'write:pets': modify pets }
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80 }
        status: { type: string, enum: [available, pending, sold] }
        birthDate: { type: string, format: date }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
